spring.application.name=Spring_Batch


spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.chat.model=gemini-3.5-flash-lite


# ---- Column-name shortening: AI tiers (optional, used by AiColumnNameBatchShortener) ----
# Master switch. Set to false to skip AI entirely and go straight to the NLP pipeline.
app.column-shortening.ai-enabled=true
# Hard timeout (seconds) for EACH AI call (Gemini, and Ollama if enabled). This is enforced
# by the app itself (Future.get(timeout)), not just the HTTP client's connect/read timeouts -
# that's what protects against a private VPN that accepts the connection but never responds
# (a silent black hole) instead of failing fast with a clean error.
app.column-shortening.ai-timeout-seconds=15





# Disable automatic batch execution on startup
spring.batch.job.enabled=false

# Disable default DataSource auto-configuration
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration

# Automatically initialize Spring Batch metadata tables if not present
spring.batch.jdbc.initialize-schema=always